<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 420" fill="none">
  <!-- Subtle Framing Container -->
  <rect x="2" y="2" width="636" height="416" rx="16" fill="#0d131f" stroke="#1e293b" stroke-width="1.5"/>

  <!-- Schematic Grid Background -->
  <path d="M40 0V420M120 0V420M200 0V420M280 0V420M360 0V420M440 0V420M520 0V420M600 0V420" stroke="#1e293b" stroke-width="0.5" stroke-dasharray="3 6" opacity="0.6"/>
  <path d="M0 60H640M0 130H640M0 200H640M0 270H640M0 340H640" stroke="#1e293b" stroke-width="0.5" stroke-dasharray="3 6" opacity="0.6"/>

  <!-- Top Schematic Identification Bar -->
  <rect x="2" y="2" width="636" height="42" rx="16" fill="#131c2e"/>
  <rect x="2" y="28" width="636" height="16" fill="#131c2e"/>
  <line x1="2" y1="44" x2="638" y2="44" stroke="#1e293b" stroke-width="1"/>
  
  <rect x="20" y="14" width="8" height="8" rx="2" fill="#38bdf8"/>
  <text x="36" y="26" fill="#cbd5e1" font-family="'Albert Sans', system-ui, sans-serif" font-size="12" font-weight="700" letter-spacing="1">DUAL-TRACK CASE ARCHITECTURE</text>
  <rect x="515" y="10" width="105" height="22" rx="4" fill="#1e293b"/>
  <text x="567" y="25" fill="#f59e0b" font-family="'Albert Sans', system-ui, sans-serif" font-size="11" font-weight="700" text-anchor="middle">INDICATIVE SPEC</text>

  <!-- Left: Problem Statement Node -->
  <g transform="translate(25, 155)">
    <rect width="135" height="96" rx="10" fill="#131c2e" stroke="#334155" stroke-width="1.5"/>
    <text x="16" y="26" fill="#94a3b8" font-family="'Albert Sans', system-ui, sans-serif" font-size="10" font-weight="700" letter-spacing="0.5">SOURCE BRIEF</text>
    <text x="16" y="52" fill="#f8fafc" font-family="'Albert Sans', system-ui, sans-serif" font-size="15" font-weight="800">Enterprise</text>
    <text x="16" y="74" fill="#f8fafc" font-family="'Albert Sans', system-ui, sans-serif" font-size="15" font-weight="800">Challenge</text>
    <circle cx="135" cy="48" r="4.5" fill="#38bdf8"/>
  </g>

  <!-- Branching Connector Paths -->
  <!-- Top Branch: Strategy Track -->
  <path d="M160 203 C 190 203, 195 105, 226 105" stroke="#0284c7" stroke-width="2.5"/>
  <polygon points="224,99 236,105 224,111" fill="#0284c7"/>

  <!-- Bottom Branch: Systems Track -->
  <path d="M160 203 C 190 203, 195 305, 226 305" stroke="#2563eb" stroke-width="2.5"/>
  <polygon points="224,299 236,305 224,311" fill="#2563eb"/>

  <!-- Track 1: Strategy & Consulting Box -->
  <g transform="translate(236, 60)">
    <rect width="190" height="92" rx="10" fill="#131c2e" stroke="#0284c7" stroke-width="1.5"/>
    <rect x="14" y="12" width="90" height="20" rx="4" fill="#0369a1"/>
    <text x="59" y="26" fill="#ffffff" font-family="'Albert Sans', system-ui, sans-serif" font-size="10" font-weight="700" text-anchor="middle">TRACK 1 • STRATEGY</text>
    <text x="14" y="54" fill="#ffffff" font-family="'Albert Sans', system-ui, sans-serif" font-size="15" font-weight="800">Case Competition</text>
    <text x="14" y="75" fill="#cbd5e1" font-family="'Albert Sans', system-ui, sans-serif" font-size="12">Diagnosis • Viability • Deck</text>
  </g>

  <!-- Track 2: Systems & Product Box -->
  <g transform="translate(236, 258)">
    <rect width="190" height="92" rx="10" fill="#131c2e" stroke="#2563eb" stroke-width="1.5"/>
    <rect x="14" y="12" width="90" height="20" rx="4" fill="#1d4ed8"/>
    <text x="59" y="26" fill="#ffffff" font-family="'Albert Sans', system-ui, sans-serif" font-size="10" font-weight="700" text-anchor="middle">TRACK 2 • SYSTEMS</text>
    <text x="14" y="54" fill="#ffffff" font-family="'Albert Sans', system-ui, sans-serif" font-size="15" font-weight="800">Product Development</text>
    <text x="14" y="75" fill="#cbd5e1" font-family="'Albert Sans', system-ui, sans-serif" font-size="12">Architecture • Prototype • POC</text>
  </g>

  <!-- Convergence Connector Paths into Finale -->
  <path d="M426 106 C 455 106, 458 185, 480 195" stroke="#0284c7" stroke-width="2.5"/>
  <path d="M426 304 C 455 304, 458 225, 480 215" stroke="#2563eb" stroke-width="2.5"/>

  <!-- Right: Grand Finale Culmination Hub -->
  <g transform="translate(480, 145)">
    <rect width="136" height="118" rx="12" fill="#131c2e" stroke="#38bdf8" stroke-width="2"/>
    <circle cx="68" cy="32" r="14" fill="#0284c7"/>
    <path d="M63 32L67 36L74 28" stroke="#ffffff" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"/>
    <text x="68" y="65" fill="#f8fafc" font-family="'Albert Sans', system-ui, sans-serif" font-size="13" font-weight="800" text-anchor="middle">GRAND FINALE</text>
    <text x="68" y="84" fill="#38bdf8" font-family="'Albert Sans', system-ui, sans-serif" font-size="13" font-weight="700" text-anchor="middle">NIT Raipur</text>
    <text x="68" y="103" fill="#cbd5e1" font-family="'Albert Sans', system-ui, sans-serif" font-size="11" text-anchor="middle">Live Jury Defense</text>
  </g>

  <!-- Bottom Metric Strip -->
  <line x1="20" y1="375" x2="620" y2="375" stroke="#1e293b" stroke-width="1"/>
  <text x="24" y="398" fill="#94a3b8" font-family="'Albert Sans', system-ui, sans-serif" font-size="11" font-weight="600">NIT RAIPUR × UNSTOP</text>
  <text x="320" y="398" fill="#94a3b8" font-family="'Albert Sans', system-ui, sans-serif" font-size="11" font-weight="600" text-anchor="middle">COLLABORATION: 3-WEEK SPRINT</text>
  <text x="616" y="398" fill="#94a3b8" font-family="'Albert Sans', system-ui, sans-serif" font-size="11" font-weight="600" text-anchor="end">4 STAGES</text>
</svg>
